[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dhaka-air-quality-research"
version = "0.1.0"
description = "Source-aware reconstruction and retrospective evaluation of the Dhaka archive"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.2,<4", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]

[project.scripts]
dhaka-air-quality = "dhaka_air_quality.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
